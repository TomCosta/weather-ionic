<ion-header [translucent]="false">
  <ion-toolbar mode="ios" color="success">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Configuração</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="fundao">

  <div class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-list lines="none">
            <form class="ion-padding-horizontal">
              <ion-item borders='none'>
                <ion-label>
                  Cidade
                </ion-label>
                <ion-input placeholder="Cidade" [(ngModel)]="city" name="city" type="text"></ion-input>
              </ion-item>
              <ion-item borders='none'>
                <ion-label>
                  País
                </ion-label>
                <ion-input placeholder="País" [(ngModel)]="country" name="country" type="text"
                  maxlength="2"></ion-input>
              </ion-item>
              <p></p>
              <ion-button expand="block" fill="outline" type="submit" color="light"
                (click)="setConfig()">Adicionar</ion-button>
            </form>
          </ion-list>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
