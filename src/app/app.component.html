<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Weather App</ion-list-header>
          <ion-note>@tomsys</ion-note>

          <ion-menu-toggle auto-hide="false">
            <ion-item lines="none" (click)="weather()">
              <ion-icon slot="start" name="thunderstorm-outline"></ion-icon>
              <ion-label>Weather</ion-label>
            </ion-item>
            <ion-item lines="none" (click)="config()">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Config</ion-label>
            </ion-item>
            <ion-item lines="none" (click)="info()">
              <ion-icon slot="start" name="information-circle-outline"></ion-icon>
              <ion-label>Info</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list id="labels-list">
          <!-- <ion-item lines="none" (click)="logout()">
            <ion-icon slot="start" name="log-out"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item> -->
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
